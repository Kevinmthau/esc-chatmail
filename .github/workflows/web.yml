name: Web CI

# The fixtures path is not incidental: the web parity tests import the iOS
# golden corpus directly through the @fixtures alias rather than copying it, so
# an iOS-side edit to those fixtures can break the web suite. Without it here,
# that break would land on main with no web signal at all.
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'esc-chatmailTests/TestSupport/Fixtures/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'esc-chatmailTests/TestSupport/Fixtures/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
