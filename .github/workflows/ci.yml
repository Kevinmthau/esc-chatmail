name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit Tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare xcconfig files
        env:
          SHARED_XCCONFIG_CONTENTS: ${{ secrets.CI_XCCONFIG }}
          DEBUG_XCCONFIG_CONTENTS: ${{ secrets.DEBUG_XCCONFIG }}
          RELEASE_XCCONFIG_CONTENTS: ${{ secrets.RELEASE_XCCONFIG }}
        run: bash Scripts/write-ci-xcconfig.sh

      - name: Xcode Version
        run: xcodebuild -version

      - name: List Available Simulators
        run: xcrun simctl list devices available | head -n 200

      - name: Run Tests
        run: bash Scripts/run-tests.sh -skip-testing esc-chatmailUITests

  testflight:
    name: Build And Upload TestFlight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      SHARED_XCCONFIG_CONTENTS: ${{ secrets.CI_XCCONFIG }}
      DEBUG_XCCONFIG_CONTENTS: ${{ secrets.DEBUG_XCCONFIG }}
      RELEASE_XCCONFIG_CONTENTS: ${{ secrets.RELEASE_XCCONFIG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        run: |
          missing=()

          [[ -n "${ASC_ISSUER_ID}" ]] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [[ -n "${ASC_KEY_ID}" ]] || missing+=("APP_STORE_CONNECT_KEY_ID")
          [[ -n "${ASC_API_PRIVATE_KEY}" ]] || missing+=("APP_STORE_CONNECT_API_KEY")

          if [[ -z "${RELEASE_XCCONFIG_CONTENTS:-${SHARED_XCCONFIG_CONTENTS:-}}" ]]; then
            missing+=("RELEASE_XCCONFIG or CI_XCCONFIG")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secrets for TestFlight:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            printf 'See docs/TESTFLIGHT_AUTOMATION.md for setup.\n' >&2
            exit 1
          fi

      - name: Prepare xcconfig files
        run: bash Scripts/write-ci-xcconfig.sh

      - name: Create App Store Connect API key file
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "${ASC_API_PRIVATE_KEY}" > "${key_path}"
          echo "ASC_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: com.esc.inboxchat
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)" >> "${GITHUB_ENV}"

      - name: Archive release build
        run: |
          xcodebuild archive \
            -project esc-chatmail.xcodeproj \
            -scheme esc-chatmail \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/esc-chatmail.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: Create export options plist
        run: |
          cat <<EOF > "${RUNNER_TEMP}/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>3JXY2MS2Y3</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export signed ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/esc-chatmail.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Locate exported ipa
        id: exported_ipa
        run: |
          ipa_path="$(find "${RUNNER_TEMP}/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No ipa was produced by xcodebuild -exportArchive." >&2
            exit 1
          fi
          echo "path=${ipa_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload build to TestFlight
        uses: Apple-Actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.exported_ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
