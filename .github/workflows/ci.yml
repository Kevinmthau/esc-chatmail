name: CI

# Runs the default test plan (PerformanceRegressionTests excluded) on every PR
# and push to main, plus an advisory SwiftLint pass. Mirrors the local
# Scripts/ wrappers so CI and local runs stay in sync.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

# A PR's newer push cancels its older run. A push to main never cancels another: every
# main commit gets a verdict, so `ship-gate` can advance `testflight` to it, and a re-run
# of an older main run cannot cancel the newest one (which would leave it unshipped).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: true

# Read-only by default. Only `ship-gate` has write access (to the repository's contents;
# its script is what limits it to the `testflight` branch).
permissions:
  contents: read

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    # A clean run is ~15 minutes (build ~4m + tests ~8m) plus the ConcurrencyDebug
    # plan's serial second pass over its suites; 50 leaves headroom for runner
    # variance. Per-test allowances below keep a single hung test from consuming the
    # whole window (macOS minutes bill at 10x).
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain and simulators
        run: |
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          xcrun simctl list devices available | grep -m 5 iPhone || true

      # The device is the one the local wrappers pick (an iPhone 17 Pro on the newest iOS
      # runtime that has one installed, Scripts/default-simulator-destination.py), never the
      # first iPhone simctl lists: that one comes from the oldest installed runtime, so a
      # runner image that adds a runtime would silently move this job onto it (architecture
      # review 2026-11, gap-ipad-and-os-floor#3). The runtime is printed so an image change
      # shows as a changed line in the log. The UDID is assigned before it is written, never
      # inside `echo "$(…)"`: under the shell's -e an echo discards the substitution's exit
      # status, and a picker that failed would have written an empty SIMULATOR_ID, leaving
      # prepare-simulator.sh to fall back to the first iPhone, unpinned, with the step green.
      - name: Pin the simulator (the wrappers' iPhone 17 Pro, newest runtime with one)
        run: |
          python3 Scripts/default-simulator-destination.py --describe
          SIMULATOR_ID="$(python3 Scripts/default-simulator-destination.py --udid)"
          echo "SIMULATOR_ID=${SIMULATOR_ID}" >> "$GITHUB_ENV"

      # Boots the pinned simulator and pre-grants Contacts to the test host
      # app, exporting DESTINATION so both steps use that device. Without the
      # grant, the first test to reach ContactsResolver blocks forever on
      # CNContactStore.requestAccess's permission dialog — the hang that timed
      # out every earlier run.
      - name: Prepare simulator (boot + grant permissions)
        run: bash Scripts/prepare-simulator.sh >> "$GITHUB_ENV"

      # Execution-time allowances turn any future hang into one failed test
      # (named in the uploaded xcresult) instead of a cancelled job with no
      # artifacts. The slowest known test is ~7s, so 120s is generous.
      - name: Run tests (default test plan)
        run: |
          bash Scripts/run-tests.sh \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300

      # A second pass over the suites of ConcurrencyDebug.xctestplan (a subset of the default
      # plan, which has just run them without the flag), under Core Data's ConcurrencyDebug
      # assertion (architecture review 2026-11, testing-ci-release#4): those suites were
      # measured clean under `-com.apple.CoreData.ConcurrencyDebug 1`, which traps on a
      # context touched off its queue. The default plan cannot carry the flag (its
      # private-queue test contexts are touched off-queue by design), so this plan is the
      # ratchet: a confinement regression in the code these suites cover fails here as a
      # crashed test, where before it shipped as a rare crash or a lost save. Serial, so a
      # crash names its host. Adding a suite is in CLAUDE.md (Testing).
      - name: Run tests (ConcurrencyDebug test plan)
        run: |
          bash Scripts/run-tests.sh --concurrency-debug \
            -resultBundlePath ConcurrencyDebugResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300

      - name: Upload the ConcurrencyDebug result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ConcurrencyDebugResults.xcresult
          path: ConcurrencyDebugResults.xcresult
          retention-days: 7

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          retention-days: 7

  # The Mac destination of the esc-chatmail target (docs/mac-app-plan.md): the app and the
  # test target are built for testing, and Mac.xctestplan runs in the built app as its test
  # host (architecture review 2026-11, mac-platform#1, testing-ci-release#3). Before, this job
  # compiled both unsigned and ran nothing, so the AppKit-mounting Mac suites ran only when a
  # developer ran them, and every merge shipped a Mac build to TestFlight that no test had run.
  #
  # The host is signed ad hoc by Scripts/CI-MacTestHost.xcconfig, which
  # run-tests.sh --ci-mac-host passes and nothing else does: a team-signed build needs the Mac
  # development profile for keychain-access-groups, which CI has not, and an unsigned build
  # (CODE_SIGNING_ALLOWED=NO) has no App Sandbox entitlement, so its host must never launch
  # (unsandboxed, the app's cleanup deletes the user's real ~/Documents/Messages). Ad-hoc
  # signing keeps the sandbox, so verify-mac-test-host.sh and MacUnitTestHostGuard admit the
  # host exactly as they admit a team-signed one, unchanged; the .ci bundle ID gives it a
  # container of its own. KeychainServiceTests is skipped (with no access group the data
  # protection keychain refuses its items); every other Mac-plan suite injects its keychain.
  # macOS runner minutes bill at 10x, so this stays one build-and-test job.
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-26
    # The unsigned compile of app and tests took 5 minutes here. What the plan's run adds
    # is not measured yet: check the first runs.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build and run the Mac test plan (ad-hoc-signed, sandboxed host)
        run: |
          DESTINATION='platform=macOS' bash Scripts/run-tests.sh --ci-mac-host \
            -resultBundlePath MacTestResults.xcresult

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MacTestResults.xcresult
          path: MacTestResults.xcresult
          retention-days: 7

  # The configuration Xcode Cloud archives and ships. Every other job builds Debug, so a
  # Release-only compile error or warning (wholemodule -O, `#if !DEBUG` branches;
  # warnings are errors in Release too) used to surface first as a failed archive after
  # the merge (architecture review 2026-11, testing-ci-release#2). That holds on CI's
  # toolchain (Xcode 26, simulator SDK) only: a warning that only Xcode Cloud's newer
  # compiler raises still fails the archive first. The app alone: the
  # test target needs DEBUG-only seams. One architecture: Release builds every one it can
  # for a generic destination, and the archive is arm64 only. Then the built Info.plist is checked, because a
  # Release build with an empty GOOGLE_* value does not trap the way Debug does.
  # iOS only: a Mac Release compile would add a second macOS job (10x minutes), which
  # is Kevin's call.
  build-release-ios:
    name: Build Release (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build app (Release, iOS Simulator, unsigned)
        run: |
          CONFIGURATION=Release DESTINATION='generic/platform=iOS Simulator' \
            bash Scripts/codex-build.sh CODE_SIGNING_ALLOWED=NO ARCHS=arm64 -derivedDataPath build/DerivedData

      - name: Check the built Info.plist
        run: |
          bash Scripts/check-built-info-plist.sh \
            build/DerivedData/Build/Products/Release-iphonesimulator/esc-chatmail.app \
            esc-chatmail/Resources/Info.plist

  # The gate between a merge and TestFlight (architecture review 2026-11,
  # testing-ci-release#1). Xcode Cloud's workflow is configured in App Store Connect,
  # not here; once its start condition is the `testflight` branch instead of `main`,
  # only a commit whose every build and test job above passed is archived.
  #
  # - Runs only for a push to main, after every build and test job succeeded
  #   (`needs` skips it otherwise).
  # - Fast-forwards `testflight` to exactly this commit, never with --force or a `+`
  #   refspec, so the shipped branch never moves back. Runs on main are not cancelled by
  #   later ones, so an older one can finish last: where `testflight` already holds a
  #   newer commit that contains this one, it pushes nothing and succeeds.
  # - Lint is advisory and is not waited for; web/ has its own workflow and does not
  #   ship through Xcode Cloud.
  ship-gate:
    name: Advance testflight branch (main only)
    needs: [test, build-macos, build-release-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward testflight to this commit
        run: |
          # True when testflight exists and already contains this commit. A failure to
          # read it is not "absent": it stops the job, so nothing is pushed on a guess.
          already_shipped() {
            local status=0
            git ls-remote --exit-code origin refs/heads/testflight >/dev/null || status=$?
            if [ "${status}" -eq 2 ]; then
              return 1
            elif [ "${status}" -ne 0 ]; then
              echo "::error::could not read origin's testflight branch (git ls-remote exit ${status}); nothing pushed"
              exit 1
            fi
            if ! git fetch --quiet origin +refs/heads/testflight:refs/remotes/origin/testflight; then
              echo "::error::could not fetch origin's testflight branch; nothing pushed"
              exit 1
            fi
            git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/testflight
          }
          if already_shipped; then
            echo "testflight already contains ${GITHUB_SHA}; nothing to push"
            exit 0
          fi
          if git push origin "${GITHUB_SHA}:refs/heads/testflight"; then
            exit 0
          fi
          # Another run's push can land between the check and this push: a newer one
          # (nothing left to do) or an older one (push again, once, on top of it).
          if already_shipped; then
            echo "testflight moved past ${GITHUB_SHA} meanwhile; nothing to push"
            exit 0
          fi
          if git merge-base --is-ancestor refs/remotes/origin/testflight "${GITHUB_SHA}" \
            && git push origin "${GITHUB_SHA}:refs/heads/testflight"; then
            exit 0
          fi
          echo "::error::testflight has diverged from main (moved by hand?): it does not contain ${GITHUB_SHA} and cannot be fast-forwarded to it. Point it by hand at the newest main commit whose CI passed, never an older one; this job never forces it."
          exit 1

  lint:
    name: SwiftLint (advisory)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Scripts/lint.sh is advisory by design (never fails the caller); this
      # job surfaces violations in the log without blocking the PR.
      - name: Run SwiftLint
        run: bash Scripts/lint.sh --reporter github-actions-logging
